caddy_email: "admin@example.com"

caddy_sites:
  - name: "example.com"
    listen: "example.com"
    reverse_proxy: "127.0.0.1:3000"
    extra_headers:
      - "X-Content-Type-Options nosniff"
      - "X-Frame-Options DENY"

  - name: "files.example.com"
    listen: "files.example.com"
    root: "/srv/files"
    file_server: true